openapi: 3.0.1
info:
  title: Authentication API
  description: API for user authentication, including sign-in, sign-up, sign-out, password recovery, and email verification.
  version: 1.0.0

paths:
  /auth/sign-in:
    post:
      summary: Sign in a user
      operationId: signIn
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: User's email address
                password:
                  type: string
                  description: User's password
      responses:
        '200':
          description: You have successfully signed in, returns authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: string
                  message:
                    type: string
        '404':
          description: User was not found
        '403':
          description: Forbidden
        '400':
          description: Invalid input data or missing information
        '401':
          description: Unauthorized, incorrect credentials
        '500':
          description: Internal server error

  /auth/sign-up:
    post:
      summary: Register a new user
      operationId: signUp
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  description: User's first name
                lastName:
                  type: string
                  description: User's last name
                email:
                  type: string
                  description: New user's email address
                password:
                  type: string
                  description: New user's password
                idCardUrl:
                  type: string
                  format: binary
                  description: The ID card file (uploaded)
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: 
                    type: boolean
                  message:
                    type: string
                    description: A one-time password (OTP) has been sent to your email address . Please enter the OTP within 5 minutes to verify your account.
        '400':
          description: Invalid input data or missing information
        '409':
          description: User already exists with the given email
        '500':
          description: Internal server error
 
  /auth/sign-out:
    post:
      summary: Sign out a user
      operationId: signOut
      tags:
        - Authentication
      responses:
        '200':
          description: You have successfully signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: 
                    type: boolean
                  message:
                    type: string
                    description: Success message
        '500':
          description: Internal server error

  /auth/refresh-token:
    post:
      summary: Refresh the access token using the refresh token
      operationId: refreshToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token to obtain a new access token
      responses:
        '200':
          description: Your access token has been refreshed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
        '400':
          description: Invalid refresh token
        '403':
          description: F0rbidden
        '500':
          description: Internal server error

  /auth/verify-otp:
    post:
      summary: Verify the OTP during the email verification process
      operationId: verifyEmail
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email
                otp:
                  type: string
                  description: The OTP sent to the user's email for verification
      responses:
        '200':
          description: Email verified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: 
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid input data or missing information
        '404':
          description: User was not found
        '500':
          description: Internal server error

  /auth/forgot-password:
    post:
      summary: Request a password reset email
      operationId: forgotPassword
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The email address of the user who wants to reset their password
      responses:
        '200':
          description: Password reset email sent successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    description: Password reset email sent successfully.
                    type: string
        '400':
          description: Invalid input data or missing information
        '404':
          description: User was not found
        '500':
          description: Internal server error
