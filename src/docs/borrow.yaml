openapi: 3.0.1
info:
  title: Borrowed Books API
  description: API for managing borrowed books, including borrowing, extending return dates, and canceling borrow requests.
  version: 1.0.0

paths:
  /borrows:
    get:
      summary: Get all borrowed books
      operationId: getAllBorrowedBooks
      tags:
        - Borrowed Books
      responses:
        '200':
          description: A list of all borrowed books
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    userId:
                      type: string
                    bookId:
                      type: string
                    borrowedDate:
                      type: string
                      format: date-time
                    returnDate:
                      type: string
                      format: date-time
                    status:
                      type: string

    post:
      summary: Borrow a book
      operationId: borrowBook
      tags:
        - Borrowed Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
               bookId:
                  type: string
                  description: ID of the book being borrowed
                
      responses:
        '201':
          description: Book borrowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the borrowing transaction
                  userId:
                    type: string
                  bookId:
                    type: string
                  borrowDate:
                    type: string
                    format: date-time
                  returnDate:
                    type: string
                    format: date-time
                  status:
                    type: string
        '400':
          description: Validation error or missing information
        '401':
          description: Unauthorized
        '404':
          description: Book or user not found
        '500':
          description: Internal server error

  /borrows/{borrowId}:
    get:
      summary: Get a specific borrowed book by ID
      operationId: getBorrowedBook
      tags:
        - Borrowed Books
      parameters:
        - name: borrowId
          in: path
          required: true
          description: ID of the borrowed book to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Borrowed book found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  userId:
                    type: string
                  bookId:
                    type: string
                  borrowDate:
                    type: string
                    format: date-time
                  returnDate:
                    type: string
                    format: date-time
                  status:
                    type: string
        '404':
          description: Borrowed book not found

    put:
      summary: Extend the return date of a borrowed book
      operationId: extendReturnDate
      tags:
        - Borrowed Books
      parameters:
        - name: borrowId
          in: path
          required: true
          description: ID of the borrowed book
          schema:
            type: string
      responses:
        '200':
          description: Return date extended successfully
        '400':
          description: Invalid date format or missing data
        '404':
          description: Borrowed book not found
        '500':
          description: Internal server error
    
    delete:
      summary: Delete a borrowed book record
      operationId: deleteBorrowedBook
      tags:
        - Borrowed Books
      parameters:
        - name: borrowId
          in: path
          required: true
          description: ID of the borrowed book to delete
          schema:
            type: string
      responses:
        '204':
          description: Borrowed book deleted successfully
        '404':
          description: Borrowed book not found
        '401':
          description: Unauthorized (Admin or Librarian only)

  /borrows/{borrowId}/cancel:
    put:
      summary: Cancel a request for a borrowed book
      operationId: cancelRequestForBorrowedBook
      tags:
        - Borrowed Books
      parameters:
        - name: borrowId
          in: path
          required: true
          description: ID of the borrowed book to cancel
          schema:
            type: string
      responses:
        '200':
          description: Borrow request canceled successfully
        '400':
          description: Invalid request or borrow ID
        '404':
          description: Borrowed book not found
        '500':
          description: Internal server error
  
  /borrows/{borrowId}/status-update:
    put:
      summary: Update the status of a borrowed book
      operationId: updateBorrowedBookStatus
      tags:
        - Borrowed Books
      parameters:
        - name: borrowId
          in: path
          required: true
          description: ID of the borrowed book
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: The updated status of the book (e.g., returned, overdue)
      responses:
        '200':
          description: Borrowed book status updated successfully
        '400':
          description: Invalid status or missing data
        '404':
          description: Borrowed book not found
        '500':
          description: Internal server error

  /borrows/user/all:
    get:
      summary: Get all borrowed books for a specific user
      operationId: getUserBorrowedBooks
      tags:
        - Borrowed Books
      responses:
        '200':
          description: A list of borrowed books for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    bookId:
                      type: string
                    borrowDate:
                      type: string
                      format: date-time
                    returnDate:
                      type: string
                      format: date-time
                    status:
                      type: string

  /borrows/statistics/all:
    get:
      summary: Get all borrowed books statistics (Admin only)
      operationId: getAllBorrowedBookStatistics
      tags:
        - Borrowed Books
      responses:
        '200':
          description: Borrowed book statistics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBooksBorrowed:
                    type: integer
                  totalUsers:
                    type: integer
                  booksByStatus:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          description: Unauthorized (Admin only)