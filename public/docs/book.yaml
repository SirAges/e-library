openapi: 3.0.1
info:
  title: Book API
  description: API for managing books, including CRUD operations and search functionality.
  version: 1.0.0

paths:
  /books:
    post:
      summary: Create a new book
      operationId: createBook
      tags:
        - Books
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  required: true
                  description: The title of the book
                description:
                  type: string
                  required: true
                  description: The description of the book
                isbn:
                  type: string
                  required: true
                  description: The ISBN of the book
                author:
                  type: string
                  required: true
                  description: Author of the book
                publisher:
                  type: string
                  required: true
                  description: The Publisher of the book
                series:
                  type: string
                  required: true
                  description: The series identifier of the book
                edition:
                  type: string
                  required: true
                  description: Edition of the book
                bookFormat:
                  type: string
                  required: true
                  description: The book format
                pages:
                  type: number
                  required: true
                  description: The number of pages of the book
                language:
                  type: string
                  required: true
                  description: The language the book was written
                genre:
                  type: string
                  required: true
                  description: The title genre
                year:
                  type: number
                  description: The production year
                copies:
                  type: number
                  required: true
                  description: Number of copies
                coverUrl:
                  type: string
                  format: binary
                  description: The cover page of the book
                ebookUrl:
                  type: string
                  format: binary
                  description: The e-file of the book
                summary:
                  type: string
                  description: A brief summary of the book
                videoUrl:
                  type: string
                  description: The triller or short video about the book
                callNumber:
                  type: string
                  description: The library call number of the book
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The ID of the created book
                  title:
                    type: string
                  author:
                    type: string
                  description:
                    type: string
                  coverImage:
                    type: string
        '400':
          description: Invalid input or validation error
        '401':
          description: Unauthorized (Admin only)
        '500':
          description: Internal server error

    get:
      summary: Get all books
      operationId: getBooks
      tags:
        - Books
      parameters:
        - name: sort
          in: query
          description: The sorting order
        - name: limit
          in: query
          description: The number of results returned
        - name: page
          in: query
          description: The page number
        - name: sortBy
          in: query
          description: Field to sort by
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    author:
                      type: string
                    description:
                      type: string
                    coverImage:
                      type: string

  /books/{bookId}:
    get:
      summary: Get a specific book by ID
      operationId: getBook
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          description: ID of the book to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  author:
                    type: string
                  description:
                    type: string
                  coverImage:
                    type: string
        '404':
          description: Book not found
    put:
      summary: Update a book by ID
      operationId: updateBook
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          description: ID of the book to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
                description:
                  type: string
                coverImage:
                  type: string
                  format: binary
      responses:
        '200':
          description: Book updated successfully
        '400':
          description: Invalid input
        '401':
          description: Unauthorized (Admin only)
        '404':
          description: Book not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a book by ID
      operationId: deleteBook
      tags:
        - Books
      parameters:
        - name: bookId
          in: path
          required: true
          description: ID of the book to delete
          schema:
            type: string
      responses:
        '204':
          description: Book deleted successfully
        '404':
          description: Book not found
        '401':
          description: Unauthorized (Admin only)

  /books/statistics/all:
    get:
      summary: Get book statistics
      operationId: bookStatistics
      tags:
        - Books
      responses:
        '200':
          description: Book statistics data
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBooks:
                    type: integer
                  totalAuthors:
                    type: integer
                  totalBooksByCategory:
                    type: object
                    additionalProperties:
                      type: integer
        '401':
          description: Unauthorized (Admin only)

  /books/search/all:
    get:
      summary: Search for books
      operationId: searchBooks
      tags:
        - Books
      parameters:
        - name: sort
          in: query
          description: The sorting order
        - name: limit
          in: query
          description: The number of results returned
        - name: page
          in: query
          description: The page number
        - name: sortBy
          in: query
          description: Field to sort by
        - name: query
          in: query
          required: true
          description: The search query for books (e.g., title, author, etc.)
          schema:
            type: string
      responses:
        '200':
          description: A list of books matching the search query
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    author:
                      type: string
                    description:
                      type: string
                    coverImage:
                      type: string
        '400':
          description: Invalid query or missing query parameter
